name: Scan (alternative scheduler)

# Alternative to cron-job.org. NOTE: GitHub may delay or skip scheduled runs under load,
# so cron-job.org is the recommended primary scheduler (see SETUP.md).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set APP_URL and CRON_SECRET repository secrets first."; exit 1
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/scan"
